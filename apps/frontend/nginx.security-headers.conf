# Security headers for every response the operator UI serves. Included once at server level
# and again in every `location` that sets its own `add_header`: nginx drops all inherited
# `add_header` directives in a block that declares any of its own, so a location with a
# Cache-Control header but no include would lose the whole policy. `always` keeps the headers
# on error responses (404, 5xx) too.
#
# CSP: scripts, styles, fonts and connections from the UI's own origin only (fonts are
# self-hosted, the API is proxied same-origin under /api); images additionally from data: URIs;
# no plugins, no <base> hijack, no framing, forms post only to self.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
