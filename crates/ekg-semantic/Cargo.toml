[package]
name = "ekg-semantic"
description = "Semantic layer: the RDF/OWL world model. Owns the WorldModel and Odoo SourceIngestor drivers."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ekg-domain = { workspace = true }
# async trait methods on the dyn WorldModel.
async-trait = "0.1"
# Async HTTP to GraphDB's RDF4J protocol. No TLS: the store is reached over
# http:// locally and under testcontainers, and reqwest's default TLS stack
# pulls in webpki-roots, whose CDLA licence fails cargo-deny. An https
# deployment would enable a TLS feature here.
reqwest = { version = "0.12", default-features = false }
# Parse SPARQL 1.1 JSON results (application/sparql-results+json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the YAML data contract, with a YAML library that has no unsafe code.
serde-saphyr = "2.0"
# Per-entity async lock (sync) and spawn_blocking to bridge the blocking Odoo
# client into the async SourceIngestor. The caller owns the runtime.
tokio = { version = "1", features = ["sync", "rt"] }
# Odoo JSON-RPC client behind the OdooIngestor.
odoo-client = { workspace = true }
# Joins the headline metrics' per-point judgments.
futures = "0.3"
# Spans through the global tracer, which does nothing until a binary installs a provider.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }

[dev-dependencies]
# In-memory fakes for the unit tests that run without Docker.
ekg-domain = { workspace = true, features = ["test-support"] }
# Drives the async WorldModel in tests, and listens as a stand-in store.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# The stand-in store the traced-request tests send to.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# Live GraphDB for the integration tests (ignored unless Docker is present).
testcontainers = "0.28"
# An in-memory span exporter, to assert what a traced operation exports.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }

[lints]
workspace = true
