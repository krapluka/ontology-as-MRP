[package]
name = "ekg-dynamic"
description = "Dynamic layer: durable monitors and the action-point lifecycle (Restate). Consumes RdfChanged; orchestrates the governed loop."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# The neutral contract: seams (WorldModel), RdfChanged, ActionPoint and its lifecycle
# states, typed ids and errors.
ekg-domain = { workspace = true }
# Durable execution for the monitor and the action-point virtual object: per-key
# exclusivity gives idempotency, durable state holds the lifecycle, and durable timers
# drive escalation.
restate-sdk = "0.13"
# The monitor joins the per-rule WorldModel::select reads, so latency is that of the
# slowest rule, not the sum.
futures = "0.3"
# Serialize the durable action-point state held in the virtual object.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# In-memory seam fakes (InMemoryWorldModel, ...) for the monitor and lifecycle tests.
# Resolver 3 keeps the feature out of non-test builds.
ekg-domain = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["rt", "macros"] }
# Deserializes a legacy audit entry in the backward-compatibility test.
serde_json = "1"
# Implements the WorldModel seam in a test double whose rule read fails.
async-trait = "0.1"

[lints]
workspace = true
