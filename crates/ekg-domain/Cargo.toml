[package]
name = "ekg-domain"
description = "Neutral domain core for the Enterprise Knowledge Graph engine: entity types, events, the async trait seams, and in-memory fakes."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# In-memory fakes for every seam. Off by default so production wiring cannot pull a
# fake in; downstream crates enable it under dev-dependencies.
test-support = []

[dependencies]
# Keeps the async trait seams (WorldModel, ActionExecutor, ...) dyn-safe.
async-trait = "0.1"
# Wire-ready domain types: Restate virtual-object state, NATS event payloads, and
# the snake_case JSON API all serialize these.
serde = { version = "1", features = ["derive"] }
# Typed engine errors.
thiserror = "2"

[dev-dependencies]
# Drives the async fakes in the hermetic governed-loop test.
tokio = { version = "1", features = ["macros", "rt"] }
# Round-trips the domain types through JSON in tests.
serde_json = "1"

[lints]
workspace = true
