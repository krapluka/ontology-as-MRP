# git-cliff configuration: https://git-cliff.org/docs/configuration
[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]\
{% if previous.version %}\
(https://github.com/krapluka/ontology-as-MRP/compare/{{ previous.version }}...{{ version }})\
{% endif %} \
({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/krapluka/ontology-as-MRP/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^(feat|fix|perf)\\((ci|build)\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^build\\((release|runtime|container|deploy)\\)!?:", group = "Build" },
  { message = "^ci\\((release|runtime|container|deploy)\\)!?:", group = "CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^\\w+\\(changelog\\)", skip = true },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
]
filter_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
