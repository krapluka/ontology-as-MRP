[package]
name = "ekg-e2e"
description = "The backend's live suites: tests that need the running local stack (GraphDB, Restate, NATS, Odoo, the cognition runtime). Run with `just test-e2e`."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# One integration-test binary, like every other crate: each suite is a module of it.
[[test]]
name = "it"
path = "tests/it/main.rs"

[dev-dependencies]
ekg-backend = { path = "../apps/backend", version = "0.1.0" }
ekg-domain = { workspace = true, features = ["test-support"] }
ekg-semantic = { workspace = true }
ekg-dynamic = { path = "../crates/ekg-dynamic", version = "0.1.0" }
ekg-cognition = { path = "../crates/ekg-cognition", version = "0.1.0" }
ekg-kinetic = { path = "../crates/ekg-kinetic", version = "0.1.0" }
# Suites create and archive throwaway Odoo records over raw JSON-RPC.
odoo-client = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
restate-sdk = "0.13"
reqwest = { version = "0.12", default-features = false }
async-trait = "0.1"
async-nats = { version = "0.52", default-features = false, features = [
    "jetstream",
    "ring",
    "crypto",
    "nkeys",
    "nuid",
    "server_2_10",
    "server_2_11",
    "server_2_12",
    "server_2_14",
] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
# A NATS JetStream broker for the round-trip suite; skips cleanly without a container runtime.
testcontainers = "0.28"
# The tool-gateway suite is an MCP client over plain http://, with ring installed for the
# client's TLS-capable builder.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# An in-memory span exporter, for the suite that reads a tool call's store spans.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }

[lints]
workspace = true
